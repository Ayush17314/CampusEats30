openapi: 3.0.3
info:
  title: CampusEats Orders & Campus Delivery API
  description: Microservices API for CampusEats (IIIT Vadodara) - CS543 Web Services
  version: 1.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Local Microservices Gateway

paths:
  /orders:
    post:
      summary: Place a new order
      description: Orchestrates catalogue price check, payment charge, rider assignment, and notifications.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Unique key to safely retry order creation without duplicate charges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed successfully
          headers:
            Location:
              schema:
                type: string
              description: URI of the newly created order
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Malformed JSON body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Domain validation failure (e.g. empty cart, invalid quantities, or declined payment)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Outbound service dependency unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      summary: List and filter orders
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [CREATED, PAID, PREPARING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of orders matching query filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalCount:
                    type: integer
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderResponse'

  /orders/{id}:
    get:
      summary: Get order details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from previous fetch for conditional caching.
      responses:
        '200':
          description: Order details
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '304':
          description: Not Modified (cached representation is still valid)
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable (requested media type not supported)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    patch:
      summary: Update order state with optimistic concurrency check
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag for optimistic concurrency control.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                deliveryAddress:
                  type: string
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Precondition Failed (ETag mismatch - resource changed concurrently)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    options:
      summary: Check allowed HTTP methods
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Allowed methods returned in Allow header
          headers:
            Allow:
              schema:
                type: string
                example: GET, POST, PUT, PATCH, DELETE, OPTIONS

  /orders/{id}/cancel:
    post:
      summary: Cancel an existing order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Order successfully cancelled
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: State Conflict (order already dispatched or delivered)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    OrderItemInput:
      type: object
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          example: dish-paneer-roll
        quantity:
          type: integer
          minimum: 1
          example: 2

    PlaceOrderRequest:
      type: object
      required:
        - studentId
        - deliveryAddress
        - items
      properties:
        studentId:
          type: string
          example: '202351001'
        vendorId:
          type: string
          example: vendor-canteen
        deliveryAddress:
          type: string
          example: 'Hostel Block B, Room 304'
        paymentMethod:
          type: string
          enum: [CAMPUS_WALLET, UPI, CARD]
          default: CAMPUS_WALLET
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'

    OrderItemOutput:
      type: object
      properties:
        itemId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unitPriceInr:
          type: number
        lineTotalInr:
          type: number

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
          example: ord-lx9214-k82a
        studentId:
          type: string
          example: '202351001'
        vendorId:
          type: string
        deliveryAddress:
          type: string
        status:
          type: string
          enum: [CREATED, PAID, PREPARING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemOutput'
        totalAmountInr:
          type: number
        estimatedMinutes:
          type: integer
        createdAt:
          type: string
          format: date-time

    ValidationErrorItem:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
